name: Deploy documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DEPLOY_PATH: /home/kymsweb/www/livewire4-docs-ja.kyms.jp

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build documentation
        run: npm run docs:build

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          if [[ -n "${DEPLOY_PORT:-}" ]]; then
            ssh-keyscan -H -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
          fi

      - name: Deploy with rsync
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          ssh_args=(-i "$HOME/.ssh/deploy_key")
          rsync_args=(-az --delete -e "ssh ${ssh_args[*]}")
          if [[ -n "${DEPLOY_PORT:-}" ]]; then
            ssh_args+=(-p "$DEPLOY_PORT")
            rsync_args=(-az --delete -e "ssh ${ssh_args[*]}")
          fi
          rsync "${rsync_args[@]}" docs/.vitepress/dist/ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"
